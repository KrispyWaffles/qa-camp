<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoxAuth — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --bg:        #0e0f11;
      --surface:   #16181c;
      --border:    #2a2d35;
      --border-focus: #f97316;
      --text:      #e8e9ec;
      --muted:     #6b7280;
      --accent:    #f97316;
      --accent-hover: #ea6a0a;
      --error:     #ef4444;
      --success:   #22c55e;
      --radius:    10px;
    }
 
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
 
    /* subtle grid texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(249,115,22,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(249,115,22,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
 
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      position: relative;
    }
 
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
 
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
 
    .logo-text {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
 
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }
 
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
    }
 
    /* ── SSO buttons ── */
    .sso-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
 
    .btn-sso {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
 
    .btn-sso:hover { border-color: var(--muted); background: rgba(255,255,255,.03); }
 
    /* ── divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
 
    /* ── form fields ── */
    .field { margin-bottom: 18px; }
 
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
 
    .input-wrap { position: relative; }
 
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
 
    input:focus { border-color: var(--border-focus); }
 
    .pw-toggle {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: 13px; font-family: inherit;
      padding: 2px 4px;
      transition: color .15s;
    }
    .pw-toggle:hover { color: var(--text); }
 
    /* ── password strength ── */
    .strength-bar {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      height: 3px;
    }
    .strength-bar span {
      flex: 1;
      background: var(--border);
      border-radius: 99px;
      transition: background .2s;
    }
    .strength-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
      min-height: 14px;
      font-family: 'DM Mono', monospace;
    }
 
    /* ── row: remember + forgot ── */
    .row-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
 
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
 
    input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
    }
 
    .link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
    }
    .link:hover { text-decoration: underline; }
 
    /* ── submit ── */
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .15s, transform .1s;
      margin-bottom: 20px;
    }
    .btn-primary:hover  { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(.99); }
 
    /* ── messages ── */
    #error-msg, #success-msg {
      display: none;
      padding: 11px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 16px;
      font-family: 'DM Mono', monospace;
    }
    #error-msg   { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.3);  color: #f87171; }
    #success-msg { background: rgba(34,197,94,.1);  border: 1px solid rgba(34,197,94,.3);  color: #4ade80; }
 
    /* ── footer ── */
    .card-footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
 
<div class="card">
 
  <div class="logo">
    <div class="logo-icon">🦊</div>
    <span class="logo-text">FoxAuth</span>
  </div>
 
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to your account to continue.</p>
 
  <!-- SSO -->
  <div class="sso-row">
    <button class="btn-sso" id="btn-google" onclick="handleSSO('Google')">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#EA4335" d="M5.27 9.77A7.01 7.01 0 0 1 19 12h-7v3h9.7A10 10 0 1 1 12 2c2.7 0 5.15 1.07 6.97 2.8L16.5 7.27A6.97 6.97 0 0 0 12 5a7 7 0 0 0-6.73 4.77Z"/></svg>
      Continue with Google
    </button>
    <button class="btn-sso" id="btn-github" onclick="handleSSO('GitHub')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.19c0 4.5 2.87 8.32 6.84 9.67.5.09.68-.22.68-.49v-1.7c-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.89 1.57 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05a9.4 9.4 0 0 1 2.5-.34c.85 0 1.7.11 2.5.34 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.07.36.32.68.94.68 1.9v2.81c0 .27.18.59.69.49A10.02 10.02 0 0 0 22 12.19C22 6.58 17.52 2 12 2Z"/></svg>
      Continue with GitHub
    </button>
  </div>
 
  <div class="divider">or sign in with email</div>
 
  <!-- Form -->
  <div id="error-msg"></div>
  <div id="success-msg"></div>
 
  <form id="login-form" novalidate>
 
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email"
             placeholder="you@example.com" autocomplete="email" />
    </div>
 
    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="pw-toggle" id="pw-toggle-btn"
                onclick="togglePassword()">Show</button>
      </div>
      <div class="strength-bar">
        <span id="s1"></span><span id="s2"></span>
        <span id="s3"></span><span id="s4"></span>
      </div>
      <div class="strength-label" id="strength-label"></div>
    </div>
 
    <div class="row-meta">
      <label class="checkbox-label">
        <input type="checkbox" id="remember-me" />
        Remember me
      </label>
      <button type="button" class="link" onclick="handleForgotPassword()">
        Forgot password?
      </button>
    </div>
 
    <button type="submit" class="btn-primary">Sign in</button>
 
  </form>
 
  <div class="card-footer">
    Don't have an account?
    <button type="button" class="link" onclick="handleSignUp()">Sign up</button>
  </div>
 
</div>
 
<script>
  // ─────────────────────────────────────────────
  // CONSTANTS
  // ─────────────────────────────────────────────
  const VALID_EMAIL    = 'tester@foxreply.com';
  const VALID_PASSWORD = 'Test1234!';
 
  // ─────────────────────────────────────────────
  // UTILS
  // ─────────────────────────────────────────────
  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('success-msg').style.display = 'none';
  }
 
  function showSuccess(msg) {
    const el = document.getElementById('success-msg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('error-msg').style.display = 'none';
  }
 
  function clearMessages() {
    document.getElementById('error-msg').style.display   = 'none';
    document.getElementById('success-msg').style.display = 'none';
  }
 
  // ─────────────────────────────────────────────
  // BUG 1 — VALIDATION: email field accepts any string, no format check
  // BUG 2 — VALIDATION: empty password field is accepted and shows wrong error
  // BUG 3 — LOGIC: password comparison is case-INSENSITIVE (toLowerCase on both sides)
  // BUG 4 — LOGIC: successful login reveals the valid password in the success message
  // BUG 5 — SECURITY: wrong password error reveals whether the email exists ("wrong password" vs "user not found")
  // BUG 6 — UI/UX: "Show/Hide" toggle swaps the label backwards (Show when hidden, Hide when showing — reversed)
  // BUG 7 — UI/UX: password strength meter counts characters but fires on blur, not on input
  // BUG 8 — UI/UX: "Remember me" checkbox state is ignored silently — no feedback and no effect
  // BUG 9 — SECURITY: password is logged to the browser console on every keypress
  // BUG 10 — VALIDATION: "Forgot password?" does nothing (no feedback, no navigation, no modal)
  // ─────────────────────────────────────────────
 
  // ── Login handler ──
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    clearMessages();
 
    const email    = document.getElementById('email').value;
    const password = document.getElementById('password').value;
 
    // BUG 2: No check for empty fields — falls through to wrong-password path
    if (!email) {
      showError('Please enter your email address.');
      return;
    }
 
    // BUG 1: No email format validation — any string passes
    // (no regex or .includes('@') check)
 
    // BUG 5: Error message distinguishes email-not-found from wrong-password (user enumeration)
    if (email.toLowerCase() !== VALID_EMAIL.toLowerCase()) {
      showError('No account found with that email address.');
      return;
    }
 
    // BUG 2: Empty password with valid email hits this branch and leaks the enumeration
    if (!password) {
      showError('Password is required.');
      return;
    }
 
    // BUG 3: Case-insensitive comparison — "test1234!" passes as "Test1234!"
    if (password.toLowerCase() !== VALID_PASSWORD.toLowerCase()) {
      showError('Incorrect password. Please try again.');
      return;
    }
 
    // BUG 4: Successful login echoes the user's password back in plain text
    showSuccess(`Signed in as ${email}. Your password is: ${password}`);
  });
 
  // ── Password visibility toggle ──
  function togglePassword() {
    const input  = document.getElementById('password');
    const button = document.getElementById('pw-toggle-btn');
 
    // BUG 6: Labels are REVERSED — button says "Show" when text is visible, "Hide" when hidden
    if (input.type === 'password') {
      input.type   = 'text';
      button.textContent = 'Show';  // BUG: should say "Hide"
    } else {
      input.type   = 'password';
      button.textContent = 'Hide';  // BUG: should say "Show"
    }
  }
 
  // ── Password strength ──
  const segments = ['s1','s2','s3','s4'];
  const colors   = ['#ef4444','#f97316','#eab308','#22c55e'];
  const labels   = ['Weak','Fair','Good','Strong'];
 
  function updateStrength() {
    const pw  = document.getElementById('password').value;
    const len = pw.length;
    let score = 0;
    if (len >= 6)  score++;
    if (len >= 10) score++;
    if (len >= 14) score++;
    if (len >= 18) score++;
 
    segments.forEach((id, i) => {
      document.getElementById(id).style.background =
        i < score ? colors[score - 1] : 'var(--border)';
    });
 
    document.getElementById('strength-label').textContent =
      score > 0 ? labels[score - 1] : '';
  }
 
  // BUG 7: Strength meter fires on 'blur' (when field loses focus), not on 'input' (as you type)
  document.getElementById('password').addEventListener('blur', updateStrength);
 
  // BUG 9: Password value logged to console on every keypress
  document.getElementById('password').addEventListener('keyup', function () {
    console.log('password field value:', this.value);
  });
 
  // ── SSO buttons ──
  function handleSSO(provider) {
    // No feedback to user — button click does nothing visible
    // (Intentionally left blank — this is observable but not a listed bug;
    //  in a real app you'd redirect. Students should note this in exploratory notes.)
    // Left blank so the click produces no visible response.
  }
 
  // ── Forgot password ──
  function handleForgotPassword() {
    // BUG 10: Does absolutely nothing — no modal, no alert, no navigation
  }
 
  // ── Sign up ──
  function handleSignUp() {
    alert('Sign up flow coming soon!');
  }
 
  // ── Remember me (BUG 8: checkbox checked state is never read or acted on) ──
  // The checkbox renders and is interactive, but its value is never checked
  // in the submit handler or anywhere else. Silent no-op.
</script>
 
</body>
</html>
